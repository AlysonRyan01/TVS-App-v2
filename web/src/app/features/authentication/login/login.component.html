<main class="container">
  <section class="brand">
    <img class="logo" src="tvs-logo-branco.png" alt="TVS Eletrônica" width="375" height="96">
    <p class="tagline">Ordens de serviço, orçamentos e vendas da loja em um só lugar.</p>
  </section>

  <section class="form-container">
    <form class="form" [formGroup]="form" (ngSubmit)="login()">
      <h1>Acesse sua conta</h1>

      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email"
             [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
             aria-describedby="email-error">
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small id="email-error">Digite um e-mail válido</small>
      }

      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password"
             autocomplete="current-password"
             [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
             aria-describedby="password-error">
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small id="password-error">A senha precisa ter ao menos 6 caracteres</small>
      }

      <button type="submit" [disabled]="form.invalid">Entrar</button>
    </form>
  </section>
</main>

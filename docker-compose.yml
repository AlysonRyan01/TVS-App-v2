services:
  api:
    build:
      context: ./src
      dockerfile: TVSApp.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?defina DB_CONNECTION_STRING no .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
      Jwt__Issuer: ${JWT_ISSUER:-tvs-app}
      Jwt__Audience: ${JWT_AUDIENCE:-tvs-app}
      Cors__Origins: ${CORS_ORIGINS:-}
      EvolutionApiSettings__BaseUrl: ${EVOLUTION_BASE_URL:-}
      EvolutionApiSettings__ApiKey: ${EVOLUTION_API_KEY:-}
      EvolutionApiSettings__Instance: ${EVOLUTION_INSTANCE:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
    networks:
      - appnetwork

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      GRAFANA_ADDRESS: ${GRAFANA_ADDRESS:-grafana.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - appnetwork

  # ---------- Observabilidade (a API não depende de nada daqui) ----------

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    mem_limit: 512m
    networks:
      - appnetwork

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    networks:
      - appnetwork

  alloy:
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro,rslave
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro   # cAdvisor: cgroups de todos os containers
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    cgroup: host
    mem_limit: 256m
    networks:
      - appnetwork

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana servido em /grafana (http://IP_DA_VPS/grafana ou https://DOMINIO/grafana).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DEFAULT_LOCALE: pt-BR
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - loki
      - prometheus
    networks:
      - appnetwork

  # ---------- WhatsApp (Evolution API) — opcional ----------
  # Só sobe com o profile "whatsapp" (COMPOSE_PROFILES=whatsapp no .env). Com ele ativo, use
  # EVOLUTION_BASE_URL=http://evolution-api:8080 para a API falar com a Evolution pela rede interna.

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${EVOLUTION_MANAGER_PORT:-8090}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: tvs_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LANGUAGE: pt-BR
    ports:
      # Painel (/manager) só na própria VPS: acesse por túnel SSH para ler o QR Code.
      - "127.0.0.1:${EVOLUTION_MANAGER_PORT:-8090}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    mem_limit: 512m
    depends_on:
      - evolution-postgres
      - evolution-redis
    networks:
      - appnetwork

  evolution-postgres:
    image: postgres:16-alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    mem_limit: 256m
    networks:
      - appnetwork

  evolution-redis:
    image: redis:7-alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    mem_limit: 128m
    networks:
      - appnetwork

networks:
  appnetwork:

volumes:
  caddy_data:
  caddy_config:
  loki_data:
  prometheus_data:
  grafana_data:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

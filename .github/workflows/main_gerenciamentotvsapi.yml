# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Deploy API

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Restore Dependencies
      run: |
        dotnet restore "Src/TVS-App.Api/TVS-App.Api.csproj"
        echo "Dependências restauradas com sucesso"

    - name: Publish Project
      run: |
        cd Src/TVS-App.Api
        dotnet publish -c Release -o ${{ github.workspace }}/publish \
          /p:AssemblyName=TVS-App.Api \
          /p:DeployOnBuild=true \
          /p:WebPublishMethod=FileSystem
        
        echo "##[group]Artefatos gerados"
        ls -la ${{ github.workspace }}/publish
        echo "##[endgroup]"

    - name: Validate Artifact
      run: |
        if [ ! -f "${{ github.workspace }}/publish/TVS-App.Api.dll" ]; then
          echo "##[error] ERRO: TVS-App.Api.dll não encontrado!"
          echo "Conteúdo da pasta:"
          ls -R ${{ github.workspace }}/publish
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app
        path: ${{ github.workspace }}/publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: dotnet-app
        path: ${{ github.workspace }}/publish

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'gerenciamentotvsapi'
        package: ${{ github.workspace }}/publish
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_XXX }}
        startup-command: 'dotnet TVS-App.Api.dll'

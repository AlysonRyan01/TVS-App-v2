# O Prometheus só armazena: as métricas chegam pelo Alloy via remote write
# (--web.enable-remote-write-receiver). A única coleta própria é a dele mesmo.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
